<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Local Text Toolbox</title>
<desc id="desc">Private text tools in your browser: diff, format, Base64 and QR code. The code panel is an illustrative diff.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="640" rx="24" fill="#111111"/>
<rect width="1280" height="640" rx="24" fill="url(#grid)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
  <rect x="64" y="56" width="8" height="8" rx="4" fill="#8df0a8"/>
  <text x="84" y="66" fill="#b9b9b5" font-size="14" letter-spacing="2.5">LOCAL FIRST. TEXT ONLY.</text>
  <text x="64" y="150" fill="#f5f5f0" font-size="48" font-weight="700" letter-spacing="-1.5">Everyday text.</text>
  <text x="64" y="210" fill="#f5f5f0" font-size="48" font-weight="700" letter-spacing="-1.5">Entirely local.</text>
  <text x="66" y="272" fill="#f5f5f0" font-size="27" font-weight="500">文本留在本地。</text>
  <text x="66" y="316" fill="#a1a19b" font-size="19">比较、整理、转换，让文本工作更简单。</text>
  <rect x="64" y="364" width="166" height="42" rx="21" fill="#202a23" stroke="#354c3b"/>
  <path d="M83 382v-4a5 5 0 0 1 10 0v4m-12 0h14v11H81z" fill="none" stroke="#8df0a8" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="107" y="390" fill="#b9e7c3" font-size="14">无需上传内容</text>
  <text x="66" y="453" fill="#6e6e68" font-size="13" letter-spacing="1.2">中文 / ENGLISH / 日本語</text>

  <rect x="636" y="89" width="580" height="376" rx="14" fill="#080808" opacity=".6"/>
  <rect x="624" y="77" width="580" height="376" rx="14" fill="#1a1a1a" stroke="#3b3b37"/>
  <path d="M624 123h580" stroke="#353531"/>
  <circle cx="648" cy="100" r="4" fill="#64645f"/><circle cx="665" cy="100" r="4" fill="#494945"/><circle cx="682" cy="100" r="4" fill="#494945"/>
  <text x="710" y="105" fill="#c5c5be" font-size="13">Text diff</text>
  <text x="1098" y="105" fill="#7e7e77" font-size="11" letter-spacing="1.3">PREVIEW</text>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16">
    <text x="650" y="167" fill="#686862">1</text><text x="694" y="167" fill="#d4d4ca">{</text>
    <text x="650" y="205" fill="#686862">2</text><text x="714" y="205" fill="#d4d4ca">"name": "local-text-toolbox",</text>
    <rect x="681" y="224" width="501" height="38" rx="4" fill="#38221f"/>
    <text x="650" y="249" fill="#95706c">3</text><text x="693" y="249" fill="#ffb1ab">− "workflow": "copy, upload, wait",</text>
    <rect x="681" y="268" width="501" height="38" rx="4" fill="#203528"/>
    <text x="650" y="293" fill="#73917a">3</text><text x="693" y="293" fill="#8df0a8">+ "workflow": "paste, done",</text>
    <text x="650" y="337" fill="#686862">4</text><text x="714" y="337" fill="#d4d4ca">"processing": "in your browser"</text>
    <text x="650" y="375" fill="#686862">5</text><text x="694" y="375" fill="#d4d4ca">}</text>
  </g>
  <path d="M624 403h580" stroke="#353531"/>
  <text x="648" y="433" fill="#a6a69d" font-size="12">Small tools. Less friction.</text>
  <text x="1047" y="433" fill="#8df0a8" font-size="12">− 1 line　+ 1 line</text>

  <path d="M64 507h1152" stroke="#353531"/>
  <g font-size="17" fill="#efefe8" font-weight="500">
    <text x="102" y="550">文本对照</text><text x="390" y="550">格式化</text><text x="678" y="550">Base64</text><text x="966" y="550">二维码</text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, monospace" fill="#8df0a8" font-size="13">
    <text x="64" y="550">01</text><text x="352" y="550">02</text><text x="640" y="550">03</text><text x="928" y="550">04</text>
  </g>
  <g font-size="13" fill="#85857e">
    <text x="102" y="579">Side by side / Inline</text><text x="390" y="579">JSON / XML / YAML</text><text x="678" y="579">Encode / Decode</text><text x="966" y="579">Text / URL → PNG</text>
  </g>
</g>
</svg>
